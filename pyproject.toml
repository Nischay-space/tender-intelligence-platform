[project]
name = "tender-intelligence-platform"
version = "0.1.0"
description = "Production-grade Tender Intelligence Platform for scraping, processing, and analyzing government tenders."
readme = "README.md"
authors = [
    { name = "Nischay-space", email = "nischayrathore1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "beautifulsoup4>=4.15.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
tender-intelligence-platform = "tender_intelligence_platform.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
